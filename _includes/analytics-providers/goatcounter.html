{% assign goatcounter_code = site.analytics.goatcounter.code | default: "" | strip %}
{% if jekyll.environment == "production" and goatcounter_code != "" %}
<script data-goatcounter="https://{{ goatcounter_code | escape }}.goatcounter.com/count"
        data-goatcounter-settings='{"path": {{ page.url | relative_url | jsonify | escape }}}'
        async src="https://gc.zgo.at/count.js"></script>
{% endif %}
